[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-battleship-course"
version = "0.1.0"
description = "A small Russian Python course built around Battleship"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pygame-ce==2.5.8",
    "PyYAML==6.0.3",
    "thonny==5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.setuptools]
packages = ["battleship_ui", "launcher", "runner", "lessons", "lessons.lesson_01"]

[tool.setuptools.package-data]
battleship_ui = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
