version: 1
course:
  title: "Создаём «Морской бой» на Python"
  description:
    - "Ты шаг за шагом напишешь свою игру."
    - "В каждом уроке ты узнаешь новую команду и сразу добавишь что-то в «Морской бой»."
    - "Ошибаться можно: запускай код, смотри результат и пробуй снова."
api_reference:
  show_board:
    introduced_in: api
    signature: "show_board(board)"
    summary: "Показывает выбранное игровое поле."
    details:
      - "board — PLAYER для твоего поля или ENEMY для поля противника."
  draw_deck:
    introduced_in: coordinates
    signature: "draw_deck(board, x, y, state)"
    summary: "Рисует одну палубу корабля в выбранной клетке."
    details:
      - "board — PLAYER для твоего поля или ENEMY для поля противника."
      - "x — номер столбца от 1 до 10."
      - "y — номер строки от 1 до 10."
      - "state — состояние палубы; сейчас доступно DECK_IDLE."
  show_miss:
    introduced_in: coordinates
    signature: "show_miss(board, x, y)"
    summary: "Показывает промах в выбранной клетке."
    details:
      - "board — PLAYER для твоего поля или ENEMY для поля противника."
      - "x — номер столбца от 1 до 10."
      - "y — номер строки от 1 до 10."
lessons:
  - id: lesson_01
    title: "Знакомство с игровым полем"
    concept: "Готовые игровые команды и координаты"
    motivating_problem: "Как командами показать поле и указать точную клетку?"
    milestone: "Показать поле игрока и поле противника"
    prerequisites: []
    content: lessons/lesson_01/lesson.md
    completion_tasks:
      - exercise_01
      - exercise_02
      - exercise_03
      - project
    tasks:
      - id: api
        kind: article
        title: "Команды игрового поля"
        section: api
      - id: exercise_01
        kind: exercise
        title: "Покажи своё поле"
        section: exercise_01
        student_file: exercises/lesson_01/exercise_01.py
        template: lessons/lesson_01/exercises/exercise_01.py
      - id: coordinates
        kind: article
        title: "Координаты клетки"
        section: coordinates
      - id: exercise_02
        kind: exercise
        title: "Нарисуй однопалубный корабль"
        section: exercise_02
        student_file: exercises/lesson_01/exercise_02.py
        template: lessons/lesson_01/exercises/exercise_02.py
      - id: exercise_03
        kind: exercise
        title: "Покажи промах"
        section: exercise_03
        student_file: exercises/lesson_01/exercise_03.py
        template: lessons/lesson_01/exercises/exercise_03.py
      - id: project
        kind: project
        title: "Пишем игру"
        section: project
        student_file: battleship.py
        template: templates/battleship.py
      - id: star
        kind: star
        title: "Задача со звёздочкой"
