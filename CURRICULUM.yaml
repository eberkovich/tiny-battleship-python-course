          - {id: reverse, label: "Сначала 5, затем 2"}
        correct_choice: two_five
        explanation: |
          ```output
          2
          5
          ```

          Python выполняет первый print, пропускает пустую строку и комментарий, затем выполняет последний print. Вызов с числом 7 написан после #, поэтому он не выполняется.
