version: 1
course:
  title: "Создаём «Морской бой» на Python"
  goal: "Создать законченную игру с 10 однопалубными кораблями у тебя и компьютера"
  promise: "Ты сам напишешь игру: расставишь флот, добавишь выстрелы и определение победителя."
  route:
    - "Расставить флот"
    - "Начать бой"
    - "Стрелять по очереди"
    - "Победа!"
  roadmap:
    - id: stage_01
      title: "Собираем флот"
      summary: "Поля, адреса клеток и готовый флот из 10 кораблей."
      lessons:
        - {id: lesson_01, title: "Знакомство с игровым полем", outcome: "Показать поле игрока и поле противника."}
        - {id: lesson_02, title: "Переменные и счётчик кораблей", outcome: "Нарисовать первый корабль и показать счётчик со значением 1."}
        - {id: lesson_03, title: "Адрес клетки", outcome: "Хранить и рисовать два корабля по адресам."}
        - {id: lesson_04, title: "Список кораблей", outcome: "Хранить три корабля в списке и считать их с len."}
        - {id: lesson_05, title: "Изменяем список", outcome: "Построить список из четырёх кораблей с append."}
        - {id: lesson_06, title: "Повторяем команды", outcome: "Нарисовать циклом фиксированный флот из 10 кораблей."}
        - {id: lesson_07, title: "Флот готов", outcome: "Показать диалог о готовом флоте и дождаться нажатия кнопки."}
    - id: stage_02
      title: "Расставляем корабли"
      summary: "Выбор клеток и проверка правильного расстояния между кораблями."
      lessons:
        - {id: lesson_08, title: "Простое решение", outcome: "Не ставить новый корабль в занятую клетку."}
        - {id: lesson_09, title: "Соседние клетки", outcome: "Не ставить корабли рядом друг с другом."}
        - {id: lesson_10, title: "Проверяем место", outcome: "Проверять место для корабля отдельной функцией."}
        - {id: lesson_11, title: "Выбираем клетку", outcome: "Выбирать клетку на поле и ставить один корабль."}
        - {id: lesson_12, title: "Расставляем весь флот", outcome: "Расставить все 10 кораблей игрока."}
        - {id: lesson_13, title: "Флот компьютера", outcome: "Создать скрытый флот компьютера."}
    - id: stage_03
      title: "Ход игры"
      summary: "Выстрелы игрока и компьютера, смена ходов и победитель."
      lessons:
        - {id: lesson_14, title: "Первый выстрел", outcome: "Сделать один выстрел и показать попадание или промах."}
        - {id: lesson_15, title: "История выстрелов", outcome: "Запоминать выстрелы и не стрелять повторно."}
        - {id: lesson_16, title: "Ход компьютера", outcome: "Добавить один случайный выстрел компьютера."}
        - {id: lesson_17, title: "Компьютер выбирает клетку", outcome: "Научить компьютер выбирать полезную клетку."}
        - {id: lesson_18, title: "Полный бой", outcome: "Играть по очереди до победы одного из флотов."}
api_reference:
  show_board:
    introduced_in: api
    signature: "show_board(board)"
    summary: "Показывает выбранное игровое поле."
    details:
      - "board — PLAYER для твоего поля или ENEMY для поля противника."
  draw_deck:
    introduced_in: coordinates
    signature: "draw_deck(board, x, y, state)"
    summary: "Рисует одну палубу корабля в выбранной клетке."
    details:
      - "board — PLAYER для твоего поля или ENEMY для поля противника."
      - "x — номер столбца от 1 до 10."
      - "y — номер строки от 1 до 10."
      - "state — состояние палубы; сейчас доступно DECK_IDLE."
  show_miss:
    introduced_in: coordinates
    signature: "show_miss(board, x, y)"
    summary: "Показывает промах в выбранной клетке."
    details:
      - "board — PLAYER для твоего поля или ENEMY для поля противника."
      - "x — номер столбца от 1 до 10."
      - "y — номер строки от 1 до 10."
  show_ship_count:
    introduced_in: lesson_02_counter
    signature: "show_ship_count(board, count)"
    summary: "Показывает или обновляет счётчик оставшихся кораблей."
    details:
      - "board — PLAYER для твоего поля или ENEMY для поля противника."
      - "count — целое неотрицательное количество кораблей."
  show_message:
    introduced_in: lesson_07_button_api
    signature: "show_message(message, label)"
    summary: "Показывает диалог с сообщением и ждёт нажатия кнопки."
    details:
      - "message — текст сообщения."
      - "label — текст на кнопке."
