          outcome: "Проверять, есть ли значение."
        - id: a21
          title: "Действие для каждого элемента"
          outcome: "Обрабатывать элементы по очереди."
        - id: a22
          title: "Внутри цикла и после него"
          outcome: "Отличать повторяемое действие от действия после цикла."
        - id: a23
          title: "Накапливаем сумму"
          outcome: "Складывать значения по шагам."
        - id: a24
          title: "Считаем подходящие элементы"
          outcome: "Считать элементы по условию."
        - id: a25
          title: "Ищем по правилу"
          outcome: "Искать подходящее значение."
        - id: a26
          title: "Добавляем элементы"
          outcome: "Расширять список."
        - id: a27
          title: "Удаляем элементы"
          outcome: "Безопасно убирать значение."
        - id: a28
          title: "Отбираем элементы"
          outcome: "Собирать подходящие значения."
        - id: a29
          title: "Повторяем до цели"
          outcome: "Повторять действие до результата."
        - id: a30
          title: "Почему цикл заканчивается"
          outcome: "Проверять остановку цикла."
        - id: a31
          title: "Планируем программу"
          outcome: "Планировать решение самостоятельной задачи."
        - id: a32
          title: "Решаем новую задачу"
          outcome: "Применять знакомые инструменты к новой задаче."
lessons:
  - id: a01
    content: lessons/a01/lesson.md
    completion_tasks: ["a01_q_number","a01_q_reader","a01_q_change"]
    tasks:
      - id: a01_intro
        kind: article
        title: "Программа и комментарии"
        section: intro
      - id: a01_q_number
        kind: question
        title: "Появится ли число?"
        section: q_number
        choices:
          - {id: seven, label: "Число 7"}
          - {id: nothing, label: "Ничего"}
          - {id: comment, label: "Текст «Покажи число 7»"}
        correct_choice: nothing
        explanation: "Перед текстом стоит #. Вся строка — комментарий, поэтому Python не выполняет просьбу и ничего не показывает."
      - id: a01_directions
        kind: article
        title: "Кому адресована подсказка"
        section: directions
      - id: a01_q_reader
        kind: question
        title: "Кто придумает загадку?"
        section: q_reader
        choices:
          - {id: child, label: "Тебе — человеку, который читает файл"}
          - {id: python, label: "Python — при запуске файла"}
        correct_choice: child
        explanation: "Это подсказка тебе. Python пропускает комментарий: он не придумывает загадку и не выводит эту строку."
      - id: a01_q_change
        kind: question
        title: "Изменится ли работа программы?"
        section: q_change
        choices:
          - {id: "yes", label: "Да, действия Python изменятся"}
          - {id: "no", label: "Нет, действия Python останутся теми же"}
        correct_choice: "no"
        explanation: "Комментарии помогают человеку читать файл, но не задают действий Python. Если исполняемые инструкции одинаковые, изменение только комментариев не меняет их работу."
      - id: a01_summary
        kind: summary
        title: "Итоги урока"
        section: summary
  - id: a02
    content: lessons/a02/lesson.md
    completion_tasks: ["a02_greeting","a02_q_print","a02_repair","a02_houses","a02_stickers"]
    tasks:
